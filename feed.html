<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media App - Feed</title>
    <link href="/src/style.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center">
    <header class="w-full bg-gray-800 p-3 sticky top-0 z-50">
        <nav class="flex justify-between max-w-3xl mx-auto">
            <a href="feed.html" class="rounded-md bg-gray-900 px-5 py-2 text-sm font-medium text-white" aria-current="page">Feed</a>
            <a href="profile.html" class="rounded-md px-5 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white">Profile</a>
            <button id="logoutBtn" class="rounded-md px-5 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white">Logout</button>
        </nav>
    </header>
    <main class="flex flex-col items-center w-full max-w-4xl p-4">
        <div class="w-full flex justify-between mb-4">
            <input type="text" id="searchInput" placeholder="Search posts..." class="input w-full bg-gray-700 border border-gray-600 rounded-lg pl-3 text-white mr-4">
            <select id="sortSelect" class="input bg-gray-700 border border-gray-600 rounded-lg pl-3 text-white">
                <option value="all">All Posts</option>
                <option value="following">Following</option>
            </select>
        </div>
        <form id="postForm" class="w-full bg-gray-800 p-4 rounded-lg mb-6">
            <input type="text" id="postTitle" name="title" placeholder="Title" required
                   class="input w-full mb-4 bg-gray-700 border border-gray-600 rounded-lg pl-3 text-white">
            <textarea id="postContent" name="body" placeholder="Content" required
                      class="input w-full mb-4 bg-gray-700 border border-gray-600 rounded-lg pl-3 text-white"></textarea>
            <input type="url" id="mediaUrl" name="mediaUrl" placeholder="Media URL"
                   class="input w-full mb-4 bg-gray-700 border border-gray-600 rounded-lg pl-3 text-white">
            <button type="submit" class="btn btn-primary w-full bg-blue-500 text-white hover:bg-blue-600 rounded-lg py-2">Create Post</button>
        </form>
        <div id="postsList" class="w-full flex flex-col items-center space-y-4">
            <!-- Posts will be dynamically inserted here -->
        </div>
    </main>

    <!-- Post Template -->
    <template id="postTemplate">
        <div class="w-full bg-gray-800 p-4 rounded-lg shadow-lg">
            <div class="flex items-center mb-2">
                <a href="#" class="flex items-center">
                    <img src="" alt="User Avatar" class="w-10 h-10 rounded-full mr-3">
                    <div>
                        <h3 class="text-lg font-semibold">Username</h3>
                    </div>
                </a>
                <p class="text-sm text-gray-400 ml-3">Timestamp</p>
            </div>
            <h4 class="text-xl font-bold mb-2 break-words cursor-pointer post-title">Post Title</h4>
            <p class="mb-4 break-words cursor-pointer post-content">Post Content</p>
            <img src="" alt="Post Media" class="w-full rounded-lg mb-4 hidden">
            <div class="flex justify-between items-center mb-4">
                <button class="text-blue-500 hover:underline edit-post-btn hidden">Edit</button>
                <button class="text-red-500 hover:underline delete-post-btn hidden">Delete</button>
            </div>
            <div class="commentsContainer w-full bg-gray-700 p-4 rounded-lg shadow-lg">
                <!-- Comments will be dynamically inserted here -->
            </div>
            <div class="flex justify-center">
                <button class="view-more-comments-btn text-blue-500 hover:underline mt-2 hidden">View More Comments</button>
                <button class="hide-comments-btn text-blue-500 hover:underline mt-2 hidden">Hide Comments</button>
            </div>
            <form class="commentForm w-full bg-gray-700 p-4 rounded-lg shadow-lg mt-4">
                <textarea name="content" placeholder="Write a comment..." required
                          class="input w-full mb-4 bg-gray-600 border border-gray-500 rounded-lg pl-3 text-white"></textarea>
                <button type="submit" class="btn btn-primary w-full bg-blue-500 text-white hover:bg-blue-600 rounded-lg py-2">Post Comment</button>
            </form>
        </div>
    </template>

    <script src="js/feed.js" type="module"></script>
</body>
</html>
