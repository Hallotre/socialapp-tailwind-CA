<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post - Social Media</title>
    <link href="/public/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center">
    <header class="w-full bg-gray-800 p-3">
        <nav class="flex justify-between max-w-3xl mx-auto">
            <a href="feed.html" class="rounded-md px-5 py-2 text-sm font-medium text-white hover:bg-gray-700 hover:text-white" >Feed</a>
            <a href="profile.html" class="rounded-md px-5 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white">Profile</a>
            <button id="logoutBtn" class="rounded-md px-5 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white">Logout</button>
        </nav>
    </header>
    <main class="flex flex-col items-center w-full max-w-4xl p-4">
        <div id="postContainer" class="w-full bg-gray-800 p-4 rounded-lg shadow-lg mb-6">
            <!-- Post details will be dynamically inserted here -->
        </div>
        <div id="commentsContainer" class="w-full bg-gray-800 p-4 rounded-lg shadow-lg mb-6">
            <h3 class="text-2xl font-bold mb-4">Comments</h3>
            <!-- Comments will be dynamically inserted here -->
        </div>
        <form id="commentForm" class="w-full bg-gray-800 p-4 rounded-lg shadow-lg">
            <textarea id="commentContent" name="content" placeholder="Write a comment..." required
                      class="input w-full mb-4 bg-gray-700 border border-gray-600 rounded-lg pl-3 text-white"></textarea>
            <button type="submit" class="btn btn-primary w-full bg-blue-500 text-white hover:bg-blue-600 rounded-lg py-2">Post Comment</button>
        </form>
    </main>

    <!-- Post Template -->
    <template id="postTemplate">
        <div>
            <div class="flex items-center mb-2">
                <img src="" alt="User Avatar" class="w-10 h-10 rounded-full mr-3">
                <div>
                    <h3 class="text-lg font-semibold">Username</h3>
                    <p class="text-sm text-gray-400">Timestamp</p>
                </div>
            </div>
            <h4 class="text-xl font-bold mb-2 break-words">Post Title</h4>
            <p class="mb-4 break-words">Post Content</p>
            <img src="" alt="Post Media" class="w-full rounded-lg mb-4 hidden">
            <div class="flex justify-between items-center">
                <button class="text-blue-500 hover:underline edit-post-btn hidden">Edit</button>
                <button class="text-red-500 hover:underline delete-post-btn hidden">Delete</button>
            </div>
        </div>
    </template>

    <!-- Comment Template -->
    <template id="commentTemplate">
        <div class="w-full bg-gray-700 p-4 rounded-lg mb-4">
            <div class="flex items-center mb-2">
                <img src="" alt="User Avatar" class="w-8 h-8 rounded-full mr-3">
                <div>
                    <h4 class="text-md font-semibold">Username</h4>
                    <p class="text-sm text-gray-400">Timestamp</p>
                </div>
            </div>
            <p>Comment Content</p>
        </div>
    </template>

    <script src="js/singlePost.js" type="module"></script>
</body>
</html>
